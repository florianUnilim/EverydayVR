<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>A-frame everyday</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    /* =========================================================
      ✅ NOTE IMPORTANTE (pour éviter les bugs audio)
      ---------------------------------------------------------
      Avant, tu avais 2 systèmes qui changeaient le volume :
      - mute-when-looked (volume 0/1)
      - turn-sound-switch (crossfade)
      => conflit => volumes instables.

      Ici : on SUPPRIME mute-when-looked
      et on intègre "mute quand je regarde pile le son"
      directement dans turn-sound-switch ✅
    ========================================================= */


    /* =========================================================
      COMPONENT : bench-sit-transition
      ---------------------------------------------------------
      Click sur le banc (phase1) =>
      - Tourne / avance vers assise
      - Paupières : fermeture (fondu noir)
      - Switch phase1 -> phase2 + spawn assis
      - Paupières : ouverture
      - Assis : tu peux te lever (touches ou mouvement VR)
    ========================================================= */
    AFRAME.registerComponent("bench-sit-transition", {
      schema: {
        rig:   { type: "selector" },
        cam:   { type: "selector" },

        lidTop: { type: "selector" },
        lidBot: { type: "selector" },

        phase1:{ type: "selector" },
        phase2:{ type: "selector" },

        seat1: { type: "selector" },
        seat2: { type: "selector" },

        targetYaw: { type: "number", default: 180 },
        rotateMs:  { type: "number", default: 700 },

        preDelayMs:   { type: "number", default: 1300 },
        closeMs:      { type: "number", default: 3000 },
        blackHoldMs:  { type: "number", default: 1000 },
        openMs:       { type: "number", default: 2000 },

        move1Ms: { type: "number", default: 650 },

        standCamY: { type: "number", default: 1.6 },
        sitCamY:   { type: "number", default: 0.95 },

        standOnAnyInput: { type: "boolean", default: true },
        standMoveThreshold: { type: "number", default: 0.12 }
      },

      init() {
        this._running = false;
        this._isSitting = false;

        this._camWorld = new THREE.Vector3();
        this._camWorldPrev = new THREE.Vector3();

        // Pour éviter que movement-controls annule l'anim / téléport
        this._savedMoveControls = null;
        this._moveWasRemoved = false;

        this.onClick = () => this.run();
        this.el.addEventListener("click", this.onClick);

        this._tickStand = this._tickStand.bind(this);

        // Lever via clavier (ZQSD / flèches / espace)
        this._onKeyDown = (e) => {
          if (!this._isSitting) return;
          if (!this.data.standOnAnyInput) return;
          const k = (e.key || "").toLowerCase();
          if (["z","q","s","d","arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) {
            this.standUp();
          }
        };
        window.addEventListener("keydown", this._onKeyDown);

        this.resetLidsInstant();
      },

      remove() {
        this.el.removeEventListener("click", this.onClick);
        window.removeEventListener("keydown", this._onKeyDown);
        this.el.sceneEl.removeEventListener("tick", this._tickStand);
      },

      // Paupières -> état "ouvert et invisible"
      resetLidsInstant() {
        const { lidTop, lidBot } = this.data;
        lidTop.setAttribute("position", "0 1.25 -0.55");
        lidBot.setAttribute("position", "0 -1.25 -0.55");
        lidTop.setAttribute("material", "opacity", 0);
        lidBot.setAttribute("material", "opacity", 0);
        lidTop.setAttribute("visible", false);
        lidBot.setAttribute("visible", false);
      },

      run() {
        const d = this.data;
        const { rig, cam, lidTop, lidBot, phase1, phase2, seat1, seat2 } = d;
        if (!rig || !cam || !lidTop || !lidBot || !phase1 || !phase2 || !seat1 || !seat2) return;
        if (this._running) return;
        this._running = true;

        this.resetLidsInstant();

        // Désactive movement-controls pendant l'anim
        this._savedMoveControls = rig.getAttribute("movement-controls");
        if (this._savedMoveControls) {
          rig.removeAttribute("movement-controls");
          this._moveWasRemoved = true;
        }

        // 1) Tourner vers le banc
        rig.setAttribute("animation__turn", {
          property: "rotation",
          to: `0 ${d.targetYaw} 0`,
          dur: d.rotateMs,
          easing: "easeOutCubic"
        });

        // 2) Avancer vers le point assise phase1
        const p1 = seat1.getAttribute("position");
        rig.setAttribute("animation__approach", {
          property: "position",
          to: `${p1.x} ${p1.y} ${p1.z}`,
          dur: d.move1Ms,
          easing: "easeOutCubic"
        });

        const t0 = Math.max(d.rotateMs, d.move1Ms) + d.preDelayMs;

        // 3) Fermeture paupières + fondu noir
        setTimeout(() => {
          lidTop.setAttribute("visible", true);
          lidBot.setAttribute("visible", true);

          lidTop.setAttribute("material", "shader: flat; color:#000; transparent:true; opacity:0");
          lidBot.setAttribute("material", "shader: flat; color:#000; transparent:true; opacity:0");

          lidTop.setAttribute("animation__closePos", {
            property: "position",
            to: "0 0.55 -0.55",
            dur: d.closeMs,
            easing: "easeInOutQuad"
          });
          lidBot.setAttribute("animation__closePos", {
            property: "position",
            to: "0 -0.55 -0.55",
            dur: d.closeMs,
            easing: "easeInOutQuad"
          });

          lidTop.setAttribute("animation__closeOp", {
            property: "material.opacity",
            to: 1,
            dur: d.closeMs,
            easing: "easeInOutQuad"
          });
          lidBot.setAttribute("animation__closeOp", {
            property: "material.opacity",
            to: 1,
            dur: d.closeMs,
            easing: "easeInOutQuad"
          });

          // 4) Fin fermeture -> hold noir -> switch -> spawn assis -> ouverture
          setTimeout(() => {
            setTimeout(() => {
              phase1.setAttribute("visible", false);
              phase2.setAttribute("visible", true);

              const p2 = seat2.getAttribute("position");
              rig.setAttribute("position", `${p2.x} ${p2.y} ${p2.z}`);

              cam.setAttribute("position", `0 ${d.sitCamY} 0`);
              this._isSitting = true;

              cam.object3D.getWorldPosition(this._camWorldPrev);

              // Ouverture
              lidTop.setAttribute("animation__openPos", {
                property: "position",
                to: "0 1.25 -0.55",
                dur: d.openMs,
                easing: "easeOutQuad"
              });
              lidBot.setAttribute("animation__openPos", {
                property: "position",
                to: "0 -1.25 -0.55",
                dur: d.openMs,
                easing: "easeOutQuad"
              });

              lidTop.setAttribute("animation__openOp", {
                property: "material.opacity",
                to: 0,
                dur: d.openMs,
                easing: "easeOutQuad"
              });
              lidBot.setAttribute("animation__openOp", {
                property: "material.opacity",
                to: 0,
                dur: d.openMs,
                easing: "easeOutQuad"
              });

              // Cleanup fin transition
              setTimeout(() => {
                lidTop.setAttribute("visible", false);
                lidBot.setAttribute("visible", false);
                this._running = false;

                // Remet movement-controls
                if (this._moveWasRemoved) {
                  rig.setAttribute("movement-controls", this._savedMoveControls);
                  this._moveWasRemoved = false;
                }

                // Active "bouger en VR => se lever"
                this.el.sceneEl.addEventListener("tick", this._tickStand);
              }, d.openMs + 80);

            }, d.blackHoldMs);
          }, d.closeMs + 30);

        }, t0);
      },

      // Si assis, on détecte un mouvement VR "réel"
      _tickStand() {
        if (!this._isSitting) return;
        const cam = this.data.cam;
        if (!cam) return;

        cam.object3D.getWorldPosition(this._camWorld);
        const dist = this._camWorld.distanceTo(this._camWorldPrev);
        this._camWorldPrev.copy(this._camWorld);

        if (dist > this.data.standMoveThreshold) {
          this.standUp();
        }
      },

      // Debout
      standUp() {
        if (!this._isSitting) return;
        const cam = this.data.cam;

        cam.setAttribute("animation__stand", {
          property: "position",
          to: `0 ${this.data.standCamY} 0`,
          dur: 350,
          easing: "easeOutCubic"
        });

        this._isSitting = false;
        this.el.sceneEl.removeEventListener("tick", this._tickStand);
      }
    });


    /* =========================================================
      COMPONENT : turn-sound-switch (✅ VERSION FINALE)
      ---------------------------------------------------------
      1) Switch "front/back" selon ton orientation (dot avec FRONT)
      2) BONUS : le son ACTIF se coupe si tu le regardes pile (dot>=0.95)
         => sans conflit, car tout est géré ici.
      3) Actif uniquement en phase2
    ========================================================= */
    AFRAME.registerComponent("turn-sound-switch", {
      schema: {
        cam: { type: "selector" },
        front: { type: "selector" },
        back: { type: "selector" },
        scene: { type: "selector" },

        // Switch front/back
        threshold: { type: "number", default: 0.35 },
        fadeMs: { type: "number", default: 450 },

        // Mute "quand tu regardes pile l'émetteur"
        lookMuteThreshold: { type: "number", default: 0.95 },
        lookMuteFadeMs: { type: "number", default: 120 },

        // Volumes "normaux" (quand pas muté)
        frontBaseVol: { type: "number", default: 0.8 },
        backBaseVol: { type: "number", default: 1.0 }
      },

      init() {
        this.state = null;
        this._raf = null;

        this._q = new THREE.Quaternion();
        this._forward = new THREE.Vector3();

        this._toFront = new THREE.Vector3();
        this._toBack  = new THREE.Vector3();

        this._camPos = new THREE.Vector3();
        this._frontPos = new THREE.Vector3();
        this._backPos  = new THREE.Vector3();

        this._phaseWasVisible = false;

        // Pour éviter de relancer un "smooth volume" 60fps
        this._lastTargetFront = null;
        this._lastTargetBack = null;
      },

      tick() {
        const sceneEl = this.data.scene;

        const camEl = this.data.cam;
        const frontEl = this.data.front;
        const backEl = this.data.back;
        if (!camEl || !frontEl || !backEl) return;

        const frontSound = frontEl.components.sound;
        const backSound  = backEl.components.sound;

        // ✅ Phase2 only
        const phaseVisible = !sceneEl || sceneEl.getAttribute("visible") !== false;

        if (!phaseVisible) {
          if (this._phaseWasVisible) {
            try { frontSound?.pauseSound(); } catch (e) {}
            try { backSound?.pauseSound(); } catch (e) {}
            this.state = null;
          }
          this._phaseWasVisible = false;
          return;
        }

        // Entrée en phase2 : play pour être prêt (si audio unlock OK)
        if (!this._phaseWasVisible) {
          try { frontSound?.playSound(); } catch (e) {}
          try { backSound?.playSound(); } catch (e) {}
          this._phaseWasVisible = true;
        }

        const camObj = camEl.object3D;

        // direction regard
        camObj.getWorldQuaternion(this._q);
        this._forward.set(0, 0, -1).applyQuaternion(this._q).normalize();

        // positions monde
        this._camPos.setFromMatrixPosition(camObj.matrixWorld);
        this._frontPos.setFromMatrixPosition(frontEl.object3D.matrixWorld);
        this._backPos.setFromMatrixPosition(backEl.object3D.matrixWorld);

        // vecteurs cam->front/back
        this._toFront.copy(this._frontPos).sub(this._camPos).normalize();
        this._toBack.copy(this._backPos).sub(this._camPos).normalize();

        const dotFront = this._forward.dot(this._toFront);
        const dotBack  = this._forward.dot(this._toBack);

        // 1) Switch principal (front/back)
        const next = (dotFront >= this.data.threshold) ? "front" : "back";
        if (next !== this.state) {
          this.state = next;
          this._crossfade(
            next === "front" ? frontEl : backEl,
            next === "front" ? backEl : frontEl
          );
        }

        // 2) Mute si tu regardes pile l'émetteur actif
        const isFrontActive = (this.state === "front");

        const activeEl   = isFrontActive ? frontEl : backEl;
        const inactiveEl = isFrontActive ? backEl : frontEl;

        const activeDot  = isFrontActive ? dotFront : dotBack;

        const activeBaseVol   = isFrontActive ? this.data.frontBaseVol : this.data.backBaseVol;
        const inactiveBaseVol = isFrontActive ? this.data.backBaseVol  : this.data.frontBaseVol;

        // Si tu regardes pile l'émetteur actif -> volume 0, sinon volume normal
        const activeTarget = (activeDot >= this.data.lookMuteThreshold) ? 0 : activeBaseVol;

        // L'inactif doit rester "bas" car le crossfade gère déjà 0/1,
        // mais on fixe son volume "normal" ici (utile après switch)
        const inactiveTarget = inactiveBaseVol;

        this._setVolumeIfChanged(frontEl, isFrontActive ? activeTarget : inactiveTarget, true);
        this._setVolumeIfChanged(backEl,  isFrontActive ? inactiveTarget : activeTarget, false);
      },

      // Crossfade (comme avant)
      _crossfade(onEl, offEl) {
        const onSound = onEl.components.sound;
        const offSound = offEl.components.sound;
        if (!onSound || !offSound) return;

        try { onSound.playSound(); } catch (e) {}
        try { offSound.playSound(); } catch (e) {}

        const duration = this.data.fadeMs;
        const t0 = performance.now();

        const startOn  = onSound.attrValue.volume ?? 0;
        const startOff = offSound.attrValue.volume ?? 1;

        if (this._raf) cancelAnimationFrame(this._raf);

        const step = () => {
          const t = Math.min(1, (performance.now() - t0) / duration);
          const e = t * t * (3 - 2 * t);

          onEl.setAttribute("sound", "volume", startOn + (1 - startOn) * e);
          offEl.setAttribute("sound", "volume", startOff * (1 - e));

          if (t < 1) {
            this._raf = requestAnimationFrame(step);
          } else {
            try { offSound.pauseSound(); } catch (e) {}
          }
        };

        this._raf = requestAnimationFrame(step);
      },

      // Petit helper : lance un mini-fade vers target, seulement si target change
      _setVolumeIfChanged(el, target, isFront) {
        const last = isFront ? this._lastTargetFront : this._lastTargetBack;
        if (last === target) return;

        if (isFront) this._lastTargetFront = target;
        else this._lastTargetBack = target;

        this._setVolumeSmooth(el, target, this.data.lookMuteFadeMs);
      },

      _setVolumeSmooth(el, target, ms) {
        const snd = el.components.sound;
        if (!snd) return;

        const start = snd.attrValue.volume ?? 1;
        const t0 = performance.now();

        const step = () => {
          const t = Math.min(1, (performance.now() - t0) / ms);
          const e = t * t * (3 - 2 * t);
          const v = start + (target - start) * e;
          el.setAttribute("sound", "volume", v);
          if (t < 1) requestAnimationFrame(step);
        };

        requestAnimationFrame(step);
      }
    });


    /* =========================================================
      COMPONENT : turn-image-switch
      ---------------------------------------------------------
      Switch entre 2 images superposées en phase2.
      Même logique que le son (front/back) avec crossfade opacité.
    ========================================================= */
    AFRAME.registerComponent("turn-image-switch", {
      schema: {
        cam: { type: "selector" },
        front: { type: "selector" },
        back: { type: "selector" },
        scene: { type: "selector" },
        threshold: { type: "number", default: 0.35 },
        fadeMs: { type: "number", default: 450 }
      },

      init() {
        this.state = null;
        this._raf = null;

        this._q = new THREE.Quaternion();
        this._forward = new THREE.Vector3();
        this._toFront = new THREE.Vector3();
        this._camPos = new THREE.Vector3();
        this._frontPos = new THREE.Vector3();

        this._phaseWasVisible = false;

        const ensureFade = (el) => {
          if (!el) return;
          el.setAttribute("material", "transparent", true);
          if (el.getAttribute("material")?.opacity == null) {
            el.setAttribute("material", "opacity", 1);
          }
        };
        ensureFade(this.data.front);
        ensureFade(this.data.back);
      },

      tick() {
        const sceneEl = this.data.scene;

        const camEl = this.data.cam;
        const frontEl = this.data.front;
        const backEl = this.data.back;
        if (!camEl || !frontEl || !backEl) return;

        const phaseVisible = !sceneEl || sceneEl.getAttribute("visible") !== false;

        if (!phaseVisible) {
          if (this._phaseWasVisible) {
            frontEl.setAttribute("visible", false);
            backEl.setAttribute("visible", false);
            this.state = null;
          }
          this._phaseWasVisible = false;
          return;
        }

        if (!this._phaseWasVisible) {
          this._phaseWasVisible = true;
          this.state = (frontEl.getAttribute("visible") !== false) ? "front" : "back";
          return;
        }

        const camObj = camEl.object3D;

        camObj.getWorldQuaternion(this._q);
        this._forward.set(0, 0, -1).applyQuaternion(this._q).normalize();

        this._camPos.setFromMatrixPosition(camObj.matrixWorld);
        this._frontPos.setFromMatrixPosition(frontEl.object3D.matrixWorld);
        this._toFront.copy(this._frontPos).sub(this._camPos).normalize();

        const dot = this._forward.dot(this._toFront);

        const next = (dot >= this.data.threshold) ? "front" : "back";
        if (next !== this.state) {
          this.state = next;
          this._crossfade(
            next === "front" ? frontEl : backEl,
            next === "front" ? backEl : frontEl
          );
        }
      },

      _crossfade(onEl, offEl) {
        const duration = this.data.fadeMs;
        const t0 = performance.now();

        onEl.setAttribute("visible", true);
        offEl.setAttribute("visible", true);

        const startOn  = (onEl.getAttribute("material")?.opacity ?? 0);
        const startOff = (offEl.getAttribute("material")?.opacity ?? 1);

        if (this._raf) cancelAnimationFrame(this._raf);

        const step = () => {
          const t = Math.min(1, (performance.now() - t0) / duration);
          const e = t * t * (3 - 2 * t);

          onEl.setAttribute("material", "opacity", startOn + (1 - startOn) * e);
          offEl.setAttribute("material", "opacity", startOff * (1 - e));

          if (t < 1) {
            this._raf = requestAnimationFrame(step);
          } else {
            offEl.setAttribute("visible", false);
          }
        };

        this._raf = requestAnimationFrame(step);
      }
    });


    /* =========================================================
      AUDIO UNLOCK (Autoplay)
      ---------------------------------------------------------
      Débloque WebAudio au premier click/touch.
      Si on n'est pas en phase2, on repause direct => pas de son en phase1.
    ========================================================= */
    const _unlockAudio = () => {
      const phase2 = document.querySelector("#phase2");
      const isPhase2 = phase2 && phase2.getAttribute("visible") !== false;

      const f = document.querySelector("#soundFront")?.components?.sound;
      const b = document.querySelector("#soundBack")?.components?.sound;

      try { f?.playSound(); } catch (e) {}
      try { b?.playSound(); } catch (e) {}

      if (!isPhase2) {
        try { f?.pauseSound(); } catch (e) {}
        try { b?.pauseSound(); } catch (e) {}
      }
    };

    window.addEventListener("click", _unlockAudio, { once: true });
    window.addEventListener("touchstart", _unlockAudio, { once: true });
  </script>
</head>

<body>
  <a-scene fog="type: exponential; color: #000000; density: 0.0025;">

    <!-- ===========================
      ASSETS
    ============================ -->
    <a-assets>
      <img id="fabricColor"  src="/EverydayVR/models/textures/Fabric019_1K-JPG_Color.jpg">
      <img id="fabricRough"  src="/EverydayVR/models/textures/Fabric019_1K-JPG_Roughness.jpg">
      <img id="fabricNormal" src="/EverydayVR/models/textures/Fabric019_1K-JPG_NormalGL.jpg">

      <img id="PaperColor" src="/EverydayVR/models/textures/Paper004_1K-JPG_Color.jpg">
      <img id="PaperRough" src="/EverydayVR/models/textures/Paper004_1K-JPG_Roughness.jpg">
      <img id="PaperNormal" src="/EverydayVR/models/textures/Paper004_1K-JPG_NormalGL.jpg">

      <img id="SnowColor" src="/EverydayVR/models/textures/Snow010A_1K-JPG_Color.jpg">
      <img id="SnowRough" src="/EverydayVR/models/textures/Snow010A_1K-JPG_Roughness.jpg">
      <img id="SnowNormal" src="/EverydayVR/models/textures/Snow010A_1K-JPG_NormalGL.jpg">

      <img id="SnowDirtColor" src="/EverydayVR/models/textures/Snow012_1K-JPG_Color.jpg">
      <img id="SnowDirtRough" src="/EverydayVR/models/textures/Snow012_1K-JPG_Roughness.jpg">
      <img id="SnowDirtNormal" src="/EverydayVR/models/textures/Snow012_1K-JPG_NormalGL.jpg">

      <a-asset-item id="bancModel" src="/EverydayVR/models/banc-no-texture.glb"></a-asset-item>
      <a-asset-item id="Porte-manteau" src="/EverydayVR/models/Coat-Rack.glb"></a-asset-item>
      <a-asset-item id="navmesh" src="/EverydayVR/models/navmesh.glb"></a-asset-item>

      <img id="montagne-bg-2" src="/images/bg-montagne-2.png">
      <img id="montagne-2"    src="/images/montagne-2.png">
      <img id="bg-left"       src="/images/bg-leftside.png">
      <img id="bg-right"      src="/images/bg-rightside.png">
      <img id="bg-en-face"    src="/images/bg-en-face.png">
    </a-assets>

    <!-- ===========================
      RIG (camera + mains)
      - movement-controls : déplacement
      - turn-sound-switch : audio front/back + mute quand on regarde pile
      - turn-image-switch : switch images
    ============================ -->
    <a-entity
      id="rig"
      position="0 1.2 4"
      rotation="0 0 0"
      movement-controls="speed: 0.15; fly: false; constrainToNavMesh: true"
      turn-sound-switch="cam: #cam; front: #soundFront; back: #soundBack; scene: #phase2; threshold: 0.35; fadeMs: 450; lookMuteThreshold: 0.90; lookMuteFadeMs: 120; frontBaseVol: 0.8; backBaseVol: 1.0"
      turn-image-switch="cam: #cam; front: #imgFront; back: #imgBack; scene: #phase2; threshold: 0.35; fadeMs: 450"
    >

      <!-- CAMERA -->
      <a-camera id="cam" speed="0.15">

        <!-- Son FRONT (positionnel) -->
        <a-entity
          id="soundFront"
          position="-0.197 0.564 -5.801"
          sound="src: url(sons/test-son.mp3); autoplay: true; loop: true; positional: true; volume: 0.8;">
        </a-entity>

        <!-- Son BACK (positionnel) -->
        <a-entity
          id="soundBack"
          position="-0.06 -1.113 1.930"
          sound="src: url(sons/chuchotement-sound-effect.mp3); autoplay: true; loop: true; positional: true; volume: 1;">
        </a-entity>

        <!-- Paupières -->
        <a-plane id="lidTop"
          position="0 1.25 -0.55"
          width="4" height="2.6"
          visible="false"
          material="shader: flat; color:#000; transparent:true; opacity:0;">
        </a-plane>

        <a-plane id="lidBot"
          position="0 -1.25 -0.55"
          width="4" height="2.6"
          visible="false"
          material="shader: flat; color:#000; transparent:true; opacity:0;">
        </a-plane>

        <!-- PC click -->
        <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
      </a-camera>

      <!-- VR lasers -->
      <a-entity id="leftHand"  laser-controls="hand: left"  raycaster="objects: .clickable"></a-entity>
      <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
    </a-entity>

    <!-- Lumières -->
    <a-entity light="type: ambient; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="1 2 1"></a-entity>

    <!-- ===========================
      PHASE 1
    ============================ -->
    <a-entity id="phase1" visible="true">
      <a-sky color="#85754e"></a-sky>

      <a-plane
        color="#9C8B61"
        height="100"
        width="100"
        rotation="-90 0 0"
        material="
          shader: standard;
          src: #fabricColor;
          roughnessMap: #fabricRough;
          normalMap: #fabricNormal;
          metalness: 0;
          repeat: 100 100;
          normalScale: 1 1;
        ">
      </a-plane>

      <!-- Banc cliquable -->
      <a-entity
        id="benchModel"
        class="clickable"
        gltf-model="#bancModel"
        position="-1.380 0 -1.500"
        scale="150 150 150"
        bench-sit-transition="
          rig:#rig;
          cam:#cam;
          lidTop:#lidTop;
          lidBot:#lidBot;
          phase1:#phase1;
          phase2:#phase2;
          seat1:#seatPointPhase1;
          seat2:#seatPointPhase2;
          targetYaw:180;
          preDelayMs:1300;
          closeMs:3000;
          blackHoldMs:1000;
          openMs:2000;
          move1Ms:650;
          sitCamY:0.95;
          standCamY:1.6;
          standOnAnyInput:true;
          standMoveThreshold:0.12;
        ">
      </a-entity>

      <a-entity
        id="coatRack"
        gltf-model="#Porte-manteau"
        position="-1.380 0 -0.472"
        scale="2 2 2">
      </a-entity>

      <a-entity id="seatPointPhase1" position="0.448 0.90 -2"></a-entity>
    </a-entity>

    <!-- ===========================
      PHASE 2
    ============================ -->
    <a-entity id="phase2" visible="false">
      <a-sky color="#94CEDB"></a-sky>

      <a-entity
        id="benchModel_phase2"
        gltf-model="#bancModel"
        position="-1.380 0.15 -1.500"
        scale="150 150 150">
      </a-entity>

      <a-plane
        color="#FFFFFE"
        height="100"
        width="100"
        rotation="-90 0 0"
        material="
          shader: standard;
          src: #SnowColor;
          roughnessMap: #SnowRough;
          normalMap: #SnowNormal;
          metalness: 0;
          repeat: 100 100;
          normalScale: 1 1;
        ">
      </a-plane>

      <a-plane
        id="sol"
        position="0.390 0.15 -1.450"
        rotation="-90 0 0"
        width="5"
        height="3"
        material="
          shader: standard;
          src: #SnowDirtColor;
          roughnessMap: #SnowDirtRough;
          normalMap: #SnowDirtNormal;
          metalness: 0;
          roughness: 1;
          transparent: true;
          opacity: 1;
          alphaMap: #solMask;
          alphaTest: 0.3;
          side: double;
        ">
      </a-plane>

      <!-- Images superposées (switch selon orientation)
           ATTENTION : tu as demandé que montagne-bg-2 soit "dans le dos"
           => imgBack = montagne-bg-2
           => imgFront = montagne-2
      -->
      <a-image
        id="imgFront"
        src="#montagne-2"
        position="0 16.450 -51.368"
        rotation="0 0 0"
        width="100"
        height="50"
        material="transparent:true; opacity:0"
        visible="false">
      </a-image>

      <a-image
        id="imgBack"
        src="#montagne-bg-2"
        position="0 16.450 -51.368"
        rotation="0 0 0"
        width="100"
        height="50"
        material="transparent:true; opacity:1"
        visible="true">
      </a-image>

      <a-image
        src="#bg-en-face"
        position="0 15.523 47.253"
        rotation="0 0 0"
        scale="1.04 1.04 1.04"
        width="100"
        height="50">
      </a-image>

      <a-image
        src="#bg-left"
        position="-49.942 16.450 -1.698"
        rotation="0 90 0"
        width="100"
        height="50">
      </a-image>

      <a-image
        src="#bg-right"
        position="49.942 16.450 -1.698"
        rotation="0 -90 0"
        width="100"
        height="50">
      </a-image>

      <a-entity id="seatPointPhase2" position="0.448 0.90 -2"></a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
